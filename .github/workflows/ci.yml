name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.23"
      - run: uv sync --locked --group dev --python 3.14
      - run: uv run --no-sync python scripts/fetch_test_upstream.py
      - run: uv run --no-sync python scripts/fetch_tools_upstream.py
      - run: uv run --no-sync ruff check custom_components tests scripts
      - run: uv run --no-sync ruff format --check custom_components tests scripts
      - run: uv run --no-sync pytest -q --timeout=30
      - run: uv run --no-sync python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: eoai-tools-bridge-install
          path: dist/*

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
