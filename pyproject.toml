[project]
name = "eoai-tools-bridge"
version = "0.3.0"
description = "Home Assistant search bridge and controlled LLM tool gateway for EOAIC2"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "gazetteer-matcher==1.1.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.6",
  "pytest-homeassistant-custom-component==0.13.371",
  "ruff==0.16.10",
  "voluptuous==0.15.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --disable-socket --allow-unix-socket"
markers = [
  "upstream: execute the pinned, unmodified EOAIC2 ScriptFunction with HA Core and simulated tools",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.eoai_tools_bridge"]
